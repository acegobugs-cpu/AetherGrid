apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-grid-operator
  namespace: aether-grid-system
  labels:
    app.kubernetes.io/name: aether-grid-operator
    app.kubernetes.io/part-of: aether-grid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aether-grid-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aether-grid-operator
        app.kubernetes.io/part-of: aether-grid
    spec:
      serviceAccountName: aether-grid-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: aether-grid-operator:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi